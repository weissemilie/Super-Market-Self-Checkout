name: Deploy til GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer afhængigheder
        run: npm ci

      - name: Kør tests
        run: npm test

      - name: Byg appen
        run: npm run build

      - name: Udgiv build-mappen som artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Udgiv til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
